<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xymbot • Hand-Crafted Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --paper-bg: #f4f1ea;
            --paper-line: #d3c9b1;
            --ink-blue: #1b3b6f;
            --ink-black: #1a1a1a;
            --accent-red: #c0392b;
            --pencil: #7f8c8d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(to right, var(--paper-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--paper-line) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            font-family: 'Special Elite', monospace;
        }

        /* Tactile Crumple Transition Overlay */
        #crumple-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #d8d3c5;
            background-image: radial-gradient(#b8b1a2 20%, transparent 21%), radial-gradient(#b8b1a2 20%, transparent 21%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: 999;
            display: none;
            opacity: 0;
            pointer-events: none;
            filter: contrast(150%) brightness(90%);
        }

        .notebook-card {
            width: 100%;
            max-width: 520px;
            background: #fffdf9;
            border: 2px dashed #b5a88c;
            padding: 40px;
            box-shadow: 8px 12px 0px rgba(0, 0, 0, 0.12);
            position: relative;
            transform: rotate(-0.5deg);
            transition: transform 0.3s ease;
        }

        .notebook-card::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 45px;
            width: 2px;
            background: rgba(192, 57, 43, 0.3);
        }

        .header h1 {
            font-family: 'Kalam', cursive;
            font-size: 32px;
            color: var(--ink-blue);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-family: 'Caveat', cursive;
            font-size: 20px;
            color: var(--pencil);
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 2px solid var(--paper-line);
            padding-bottom: 12px;
        }

        .tab-btn {
            font-family: 'Kalam', cursive;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--pencil);
            padding: 4px 12px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--ink-blue);
            background: #f0ece1;
            border-bottom: 3px solid var(--ink-blue);
            transform: scale(1.05);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 14px;
            font-family: 'Kalam', cursive;
            color: var(--ink-blue);
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--ink-black);
            font-size: 24px;
            outline: none;
            font-family: 'Caveat', cursive;
            letter-spacing: 1px;
        }

        input.blue-ink { color: var(--ink-blue); }
        input.black-ink { color: var(--ink-black); }

        input::placeholder {
            color: #b5a88c;
            font-family: 'Special Elite', monospace;
            font-size: 13px;
        }

        .stamp-btn {
            width: 100%;
            padding: 14px;
            background: var(--ink-blue);
            color: #fff;
            border: 2px solid var(--ink-black);
            font-family: 'Kalam', cursive;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--ink-black);
            transition: all 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .stamp-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--ink-black);
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            background: #fcf8ec;
            border: 2px dashed var(--ink-blue);
            text-align: center;
            display: none;
        }

        .code-display {
            font-family: 'Special Elite', monospace;
            font-size: 28px;
            color: var(--accent-red);
            letter-spacing: 3px;
            background: #fff;
            padding: 10px;
            border: 1px solid var(--paper-line);
            display: inline-block;
        }

        .qr-display {
            background: #fff;
            padding: 12px;
            border: 2px solid var(--ink-black);
            display: inline-block;
        }

        #custom-alert {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; display: none; opacity: 0;
        }

        .alert-card {
            background: #fffdf9;
            border: 2px solid var(--ink-blue);
            padding: 30px; max-width: 380px; width: 90%;
            text-align: center; box-shadow: 6px 6px 0px var(--ink-black);
            transform: scale(0.9);
        }

        .alert-card h3 { font-family: 'Kalam', cursive; font-size: 24px; color: var(--accent-red); margin-bottom: 10px; }
        .alert-card p { font-family: 'Caveat', cursive; font-size: 20px; color: var(--ink-black); margin-bottom: 20px; }
        .alert-btn { background: var(--ink-blue); color: #fff; border: 1px solid var(--ink-black); padding: 8px 24px; font-family: 'Kalam', cursive; font-size: 18px; cursor: pointer; }

        .footer-scribbles {
            margin-top: 30px; display: flex; justify-content: space-between;
            font-family: 'Caveat', cursive; font-size: 18px;
        }
        .footer-scribbles a { color: var(--ink-blue); text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div id="crumple-overlay"></div>

    <div id="custom-alert">
        <div class="alert-card" id="alert-card-inner">
            <h3 id="alert-title">Notice Note</h3>
            <p id="alert-message">Something went wrong!</p>
            <button class="alert-btn" onclick="closeAlert()">Okay, Got it</button>
        </div>
    </div>

    <div class="notebook-card" id="main-card">
        <div class="header">
            <h1>Notebook Pairing Log</h1>
            <p>// handwritten session & bot linkage portal</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pair')">01. Pairing Code</button>
            <button class="tab-btn" onclick="switchTab('qr')">02. QR Stamp</button>
        </div>

        <div id="pair-content" class="tab-content active">
            <form id="pair-form">
                <div class="input-group">
                    <label>Session Name Scribble:</label>
                    <input type="text" id="pair-custom" class="pen-input" placeholder="e.g. sneha-bot" required>
                </div>
                <div class="input-group">
                    <label>Phone Digits:</label>
                    <input type="tel" id="pair-phone" class="pen-input" placeholder="e.g. 919876543210" required>
                </div>
                <button type="submit" class="stamp-btn" id="pair-submit-btn">Stamp & Generate Code</button>
            </form>

            <div id="pair-result" class="result-box">
                <h3 style="font-family:'Kalam'; color:var(--ink-blue)">Assigned Pairing Code:</h3>
                <p style="font-family:'Caveat'; font-size:18px; color:var(--pencil)">Copy this into your WhatsApp linked devices:</p>
                <code class="code-display" id="pair-code">----</code>
            </div>
        </div>

        <div id="qr-content" class="tab-content">
            <form id="qr-form">
                <div class="input-group">
                    <label>Session Name Scribble:</label>
                    <input type="text" id="qr-custom" class="pen-input" placeholder="e.g. sneha-bot" required>
                </div>
                <button type="submit" class="stamp-btn" id="qr-submit-btn">Render QR Stamp</button>
            </form>

            <div id="qr-result" class="result-box">
                <h3 style="font-family:'Kalam'; color:var(--ink-blue)">Scan Paper QR:</h3>
                <p style="font-family:'Caveat'; font-size:18px; color:var(--pencil)">Point phone camera to scan configuration code.</p>
                <div class="qr-display" id="qr-code-img"></div>
            </div>
        </div>

        <div class="footer-scribbles">
            <a onclick="crumpleTransition('/license-portal')">➔ Go to License Portal</a>
            <span>[Verified Notebook]</span>
        </div>
    </div>

    <script>
        document.querySelectorAll('.pen-input').forEach(input => {
            input.classList.add(Math.random() > 0.5 ? 'blue-ink' : 'black-ink');
        });

        function switchTab(type) {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');
            tabBtns.forEach(btn => btn.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            if (type === 'pair') {
                tabBtns[0].classList.add('active');
                document.getElementById('pair-content').classList.add('active');
            } else {
                tabBtns[1].classList.add('active');
                document.getElementById('qr-content').classList.add('active');
            }
        }

        function showAlert(title, message) {
            const alertBox = document.getElementById('custom-alert');
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            alertBox.style.display = 'flex';
            anime({ targets: alertBox, opacity: [0, 1], duration: 200, easing: 'easeOutQuad' });
            anime({ targets: '#alert-card-inner', scale: [0.8, 1], duration: 300, easing: 'spring(1, 80, 10, 0)' });
        }

        function closeAlert() {
            const alertBox = document.getElementById('custom-alert');
            anime({ targets: alertBox, opacity: [1, 0], duration: 200, easing: 'easeInQuad', complete: () => alertBox.style.display = 'none' });
        }

        function crumpleTransition(targetUrl) {
            const overlay = document.getElementById('crumple-overlay');
            overlay.style.display = 'block';

            anime.timeline()
                .add({ targets: overlay, opacity: [0, 0.95], scale: [1.3, 1], duration: 250, easing: 'easeInOutExpo' })
                .add({
                    targets: '#main-card',
                    scale: [1, 0.6],
                    rotate: [-0.5, 15],
                    translateX: [0, -20],
                    skewX: [0, 20],
                    opacity: [1, 0],
                    duration: 350,
                    easing: 'easeInOutBack',
                    complete: () => { window.location.href = targetUrl; }
                }, 0);
        }

        document.getElementById('pair-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('pair-phone').value;
            const custom = document.getElementById('pair-custom').value;
            const resultBox = document.getElementById('pair-result');
            const submitBtn = document.getElementById('pair-submit-btn');

            submitBtn.innerText = "Stamping Code...";
            submitBtn.disabled = true;

            try {
                const res = await fetch(`/pair?phone=${phone}&custom=${custom}`);
                const data = await res.json();
                if (data.code) {
                    document.getElementById('pair-code').innerText = data.code;
                    resultBox.style.display = 'block';
                    anime({ targets: resultBox, scale: [0.9, 1], opacity: [0, 1], duration: 500 });
                    showAlert("Success!", "Pairing code generated successfully.");
                } else {
                    showAlert("Generation Error", data.error || 'Failed to generate code.');
                }
            } catch (err) {
                showAlert("Connection Error", "Could not reach server endpoints.");
            } finally {
                submitBtn.innerText = "Stamp & Generate Code";
                submitBtn.disabled = false;
            }
        });

        document.getElementById('qr-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const custom = document.getElementById('qr-custom').value;
            const submitBtn = document.getElementById('qr-submit-btn');
            submitBtn.innerText = "Initializing QR...";
            submitBtn.disabled = true;

            try {
                const res = await fetch(`/qr?custom=${custom}`);
                const data = await res.json();
                if (data.id) {
                    pollSessionStatus(data.id);
                } else {
                    showAlert("QR Error", data.error || 'Failed to initialize session.');
                    submitBtn.innerText = "Render QR Stamp";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showAlert("Connection Error", "Could not connect to session manager.");
                submitBtn.innerText = "Render QR Stamp";
                submitBtn.disabled = false;
            }
        });

        async function pollSessionStatus(sessionId) {
            const resultBox = document.getElementById('qr-result');
            const qrImgContainer = document.getElementById('qr-code-img');
            const submitBtn = document.getElementById('qr-submit-btn');
            resultBox.style.display = 'block';
            qrImgContainer.innerHTML = '<p style="font-family:Caveat; font-size:18px;">Drawing QR Stamp...</p>';

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/status?id=${sessionId}`);
                    const data = await res.json();
                    if (data.status === 'waiting' && data.qr) {
                        clearInterval(interval);
                        qrImgContainer.innerHTML = '';
                        new QRCode(qrImgContainer, { text: data.qr, width: 180, height: 180 });
                        submitBtn.innerText = "Render QR Stamp";
                        submitBtn.disabled = false;
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        showAlert("Session Error", data.error || "Failed to load QR code.");
                        submitBtn.innerText = "Render QR Stamp";
                        submitBtn.disabled = false;
                    }
                } catch (err) { console.error('Polling error', err); }
            }, 3000);
        }
    </script>
</body>
</html>
