<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xymbot Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 28px;
            background: -webkit-linear-gradient(#00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }
        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 5px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #00d2ff;
        }
        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-weight: 600;
        }
        input::placeholder { color: #888; }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #code-display, #qr-display {
            display: none;
            margin-top: 30px;
        }
        .code-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #00d2ff;
            margin-bottom: 15px;
            border: 1px dashed rgba(0, 210, 255, 0.5);
        }
        #qr-image {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #ffaa00;
        }
        .loader {
            display: none;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #00d2ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Xymbot Pairing</h1>
        <p>Choose a method to link your WhatsApp and receive your session file.</p>
        
        <div class="tabs">
            <div class="tab active" id="tab-code" onclick="switchTab('code')">Pairing Code</div>
            <div class="tab" id="tab-qr" onclick="switchTab('qr')">QR Code</div>
        </div>

        <div id="section-code">
            <input type="text" id="phone" placeholder="Phone Number (e.g. 919876543210)">
            <button id="btn-code" onclick="getCode()">Get Pairing Code</button>
        </div>

        <div id="section-qr" style="display: none;">
            <button id="btn-qr" onclick="getQR()">Generate QR Code</button>
        </div>

        <div class="loader" id="loader"></div>
        <div class="status" id="status"></div>

        <div id="code-display">
            <div class="code-box" id="code">----</div>
            <p style="margin-bottom: 0;">Enter this code in WhatsApp -> Linked Devices</p>
        </div>

        <div id="qr-display">
            <img id="qr-image" src="" alt="QR Code">
            <p style="margin-bottom: 0;">Scan this QR with WhatsApp -> Linked Devices</p>
            <p style="font-size: 11px; color: #ffaa00; margin-top: 5px;">Scan quickly before it expires!</p>
        </div>
    </div>

    <script>
        let currentMode = 'code';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-code').classList.toggle('active', mode === 'code');
            document.getElementById('tab-qr').classList.toggle('active', mode === 'qr');
            
            document.getElementById('section-code').style.display = mode === 'code' ? 'block' : 'none';
            document.getElementById('section-qr').style.display = mode === 'qr' ? 'block' : 'none';
            
            document.getElementById('code-display').style.display = 'none';
            document.getElementById('qr-display').style.display = 'none';
            document.getElementById('status').innerText = '';
        }

        async function getCode() {
            const phoneInput = document.getElementById('phone').value;
            const btn = document.getElementById('btn-code');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const codeDisplay = document.getElementById('code-display');
            const codeBox = document.getElementById('code');

            if (!phoneInput) {
                alert("Please enter a phone number!");
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            status.innerText = "Requesting code from WhatsApp...";
            status.style.color = "#ffaa00";
            codeDisplay.style.display = 'none';

            try {
                const response = await fetch(`/pair?phone=${encodeURIComponent(phoneInput)}`);
                const data = await response.json();

                loader.style.display = 'none';

                if (data.error) {
                    status.innerText = "❌ " + data.error;
                    status.style.color = "#ff4444";
                    btn.disabled = false;
                } else if (data.code) {
                    status.innerText = "✅ Waiting for you to link device...";
                    status.style.color = "#00ff88";
                    codeBox.innerText = data.code;
                    codeDisplay.style.display = 'block';
                }
            } catch (err) {
                loader.style.display = 'none';
                btn.disabled = false;
                status.innerText = "❌ Server error. Make sure the server is running.";
                status.style.color = "#ff4444";
            }
        }

        async function getQR() {
            const btn = document.getElementById('btn-qr');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const qrDisplay = document.getElementById('qr-display');
            const qrImage = document.getElementById('qr-image');

            btn.disabled = true;
            loader.style.display = 'block';
            status.innerText = "Generating QR Code...";
            status.style.color = "#ffaa00";
            qrDisplay.style.display = 'none';

            try {
                const response = await fetch(`/qr`);
                const data = await response.json();

                loader.style.display = 'none';

                if (data.error) {
                    status.innerText = "❌ " + data.error;
                    status.style.color = "#ff4444";
                    btn.disabled = false;
                } else if (data.qr) {
                    status.innerText = "✅ Scan this QR Code with WhatsApp...";
                    status.style.color = "#00ff88";
                    qrImage.src = data.qr;
                    qrDisplay.style.display = 'block';
                }
            } catch (err) {
                loader.style.display = 'none';
                btn.disabled = false;
                status.innerText = "❌ Server error. Make sure the server is running.";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
