<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xymbot • Admin Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Special+Elite&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="symbiotic-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            --paper-bg: #f4f1ea;
            --paper-line: #d3c9b1;
            --paper-sheet: #fffdf9;
            --ink-blue: #1b3b6f;
            --ink-black: #1a1a1a;
            --accent-red: #c0392b;
            --pencil: #7f8c8d;
            --text-muted: #7f8c8d;
            --success: #317a4c;
            --card-border: #b5a88c;
            --card-shadow: rgba(0, 0, 0, 0.12);
            --margin-red: rgba(192, 57, 43, 0.3);
            --table-wrap-bg: #fffefa;
            --th-bg: #f0ece1;
            --td-border: #e8e1d3;
            --symbiote-glow: rgba(0, 240, 255, 0.25);
        }

        [data-theme="dark"] {
            --paper-bg: #0d1117;
            --paper-line: #1c2333;
            --paper-sheet: #131a24;
            --ink-blue: #58a6ff;
            --ink-black: #e6edf3;
            --accent-red: #ff7b72;
            --pencil: #8b949e;
            --text-muted: #8b949e;
            --success: #3fb950;
            --card-border: #30363d;
            --card-shadow: rgba(0, 0, 0, 0.65);
            --margin-red: rgba(255, 123, 114, 0.35);
            --table-wrap-bg: #161e2b;
            --th-bg: #1e2838;
            --td-border: #232c3d;
            --symbiote-glow: rgba(88, 166, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Special Elite', monospace;
            background-color: var(--paper-bg);
            background-image: linear-gradient(to right, var(--paper-line) 1px, transparent 1px), linear-gradient(to bottom, var(--paper-line) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 38px 36px 36px 64px;
            background: var(--paper-sheet);
            border: 2px dashed var(--card-border);
            box-shadow: 8px 12px 0 var(--card-shadow);
            position: relative;
            transform: rotate(-0.2deg);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 44px;
            width: 2px;
            background: var(--margin-red);
        }

        h1 {
            color: var(--ink-blue);
            font: 700 28px 'Kalam', cursive;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--pencil);
            font: 600 19px 'Caveat', cursive;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--ink-blue);
            font: 700 15px 'Kalam', cursive;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 8px;
            background: transparent;
            border: 0;
            border-bottom: 2px solid var(--ink-black);
            color: var(--ink-blue);
            font: 16px 'Special Elite', monospace;
            outline: none;
        }

        input:focus {
            border-bottom-color: var(--ink-blue);
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            padding: 12px 18px;
            background: var(--ink-blue);
            border: 2px solid var(--ink-black);
            color: #fff;
            font: 700 17px 'Kalam', cursive;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--card-shadow);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--symbiote-glow) 10%, transparent 60%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .btn-primary:hover::after {
            opacity: 1;
            animation: symbiote-tendril-swell 3s ease-in-out infinite alternate;
        }

        @keyframes symbiote-tendril-swell {
            0% {
                transform: scale(0.85) rotate(0deg);
            }

            100% {
                transform: scale(1.15) rotate(15deg);
            }
        }

        .btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--card-shadow);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .days-input {
            width: 90px;
            padding: 8px 10px;
            border: 1px dashed var(--card-border);
            border-bottom: 2px solid var(--ink-blue);
            font-size: 14px;
            text-align: center;
        }

        .sap-table-wrap {
            overflow-x: auto;
            margin-top: 16px;
            max-height: 60vh;
            border: 1px dashed var(--card-border);
            background: var(--table-wrap-bg);
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            background: var(--th-bg);
            color: var(--ink-blue);
            padding: 12px;
            font: 700 15px 'Kalam', cursive;
            border-bottom: 2px solid var(--paper-line);
        }

        td {
            padding: 12px;
            color: var(--ink-black);
            border-bottom: 1px solid var(--td-border);
            font: 13px 'Special Elite', monospace;
        }

        .action-btn {
            padding: 5px 10px;
            border: 1px solid var(--accent-red);
            background: transparent;
            color: var(--accent-red);
            font: 700 13px 'Kalam', cursive;
            cursor: pointer;
        }

        .action-btn:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .logout-btn {
            padding: 8px 14px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--pencil);
            font: 700 14px 'Kalam', cursive;
            cursor: pointer;
        }

        .logout-btn:hover {
            color: var(--ink-black);
            border-color: var(--ink-black);
        }

        /* ─── SYMBIOTIC THEME TOGGLE ─── */
        #symbiote-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .symbiote-toggle-wrap {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }

        .symbiote-toggle-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: var(--paper-sheet);
            border: 2px solid var(--ink-black);
            color: var(--ink-black);
            font-family: 'Kalam', cursive;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--card-shadow);
            outline: none;
            border-radius: 999px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.3s ease, color 0.3s ease;
        }

        .symbiote-toggle-btn:hover {
            transform: translate(-2px, -2px) scale(1.03);
            box-shadow: 6px 6px 0px var(--card-shadow), 0 0 16px var(--symbiote-glow);
        }

        .symbiote-toggle-btn:active {
            transform: translate(2px, 2px) scale(0.97);
            box-shadow: 2px 2px 0px var(--card-shadow);
        }

        .symbiote-orb {
            position: relative;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffd166, #e76f51);
            box-shadow: 0 0 8px rgba(231, 111, 81, 0.6);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        [data-theme="dark"] .symbiote-orb {
            background: radial-gradient(circle at 35% 35%, #00f0ff, #7928ca);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.6);
            transform: rotate(180deg);
        }

        .symbiote-orb::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 1.5px dashed var(--ink-blue);
            animation: symbiote-ring-spin 8s linear infinite;
            opacity: 0.7;
        }

        @keyframes symbiote-ring-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .symbiote-toggle-btn.symbiotic-pulsing {
            animation: symbiote-organism-twitch 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes symbiote-organism-twitch {
            0% {
                transform: scale(1);
            }

            20% {
                transform: scale(1.15) rotate(-3deg);
                filter: drop-shadow(0 0 18px var(--symbiote-glow));
            }

            45% {
                transform: scale(0.92) rotate(3deg);
            }

            70% {
                transform: scale(1.06) rotate(-1deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        @media (max-width: 640px) {
            body {
                align-items: flex-start;
                padding: 14px;
            }

            .container {
                padding: 30px 18px 24px 42px;
            }

            .container::before {
                left: 28px;
            }

            .dashboard-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .controls-row {
                width: 100%;
            }

            .controls-row .btn-primary {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <canvas id="symbiote-canvas"></canvas>

    <div class="symbiote-toggle-wrap">
        <button id="theme-toggle" class="symbiote-toggle-btn" aria-label="Toggle symbiotic theme mode"
            title="Shift Symbiotic State">
            <span class="symbiote-orb" id="symbiote-orb"></span>
            <span id="theme-label">Light Organism</span>
        </button>
    </div>

    <div class="container" id="admin-hub">
        <div id="login-box">
            <h1>🔒 Admin SAP Authentication</h1>
            <p class="subtitle">Enter your master admin password to access control panel.</p>
            <form id="admin-login-form" onsubmit="event.preventDefault(); verifyAdmin();">
                <div class="input-group">
                    <label for="admin-secret">Admin Secret Key</label>
                    <input type="password" id="admin-secret" placeholder="Enter master key..." required>
                </div>
                <button type="submit" class="btn-primary">Login to Dashboard</button>
            </form>
        </div>

        <div id="dashboard-box" style="display: none;">
            <div class="dashboard-header">
                <div>
                    <h1>SAP Control Center</h1>
                    <p class="subtitle">Manage, view, and revoke active customer license keys.</p>
                </div>
                <div class="controls-row">
                    <input type="number" id="key-duration-days" class="days-input" min="1" max="3650" value="30"
                        title="Duration in days">
                    <button type="button" class="btn-primary" style="padding: 10px 18px;" onclick="generateKey()">+
                        Generate Key</button>
                    <button type="button" class="logout-btn" onclick="logoutAdmin()">Lock</button>
                </div>
            </div>
            <div class="sap-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>License Key</th>
                            <th>Bound Session</th>
                            <th>Expires At</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="keys-table-body">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="symbiotic-engine.js"></script>
    <script>
        SymbioticWatercolor.init({
            canvasId: 'symbiote-canvas',
            toggleId: 'theme-toggle',
            labelId: 'theme-label'
        });

        anime({ targets: '#admin-hub', opacity: [0, 1], translateY: [20, 0], duration: 800, easing: 'easeOutExpo' });

        function getAdminSecret() {
            return sessionStorage.getItem('xymbot_admin_secret') || '';
        }

        function getAdminHeaders(extra = {}) {
            return {
                'x-admin-secret': getAdminSecret(),
                ...extra
            };
        }

        function logoutAdmin() {
            sessionStorage.removeItem('xymbot_admin_secret');
            document.getElementById('admin-secret').value = '';
            document.getElementById('dashboard-box').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        }

        async function verifyAdmin() {
            const secret = document.getElementById('admin-secret').value.trim();
            if (!secret) {
                alert('Please enter your admin secret key!');
                return;
            }

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    sessionStorage.setItem('xymbot_admin_secret', secret);
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('dashboard-box').style.display = 'block';
                    fetchKeys();
                } else {
                    alert(data.error || 'Access Denied: Incorrect Admin Key!');
                }
            } catch (err) {
                alert('Connection error verifying admin key.');
            }
        }

        async function fetchKeys() {
            try {
                const res = await fetch('/api/admin/keys', { headers: getAdminHeaders() });
                const data = await res.json();

                if (res.status === 401) {
                    logoutAdmin();
                    alert('Session expired or unauthorized. Please sign in again.');
                    return;
                }

                const tbody = document.getElementById('keys-table-body');
                tbody.innerHTML = '';

                if (data.keys && data.keys.length > 0) {
                    data.keys.forEach(k => {
                        const isExpired = k.expiresAt && new Date() > new Date(k.expiresAt);
                        const statusColor = isExpired
                            ? 'var(--accent-red)'
                            : (k.isActivated ? 'var(--success)' : 'var(--text-muted)');
                        const statusText = isExpired
                            ? 'Expired'
                            : (k.isActivated ? 'Active' : 'Unused');

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td><button type="button" class="action-btn btn-delete">Revoke</button></td>
                        `;
                        row.children[0].textContent = k.key;
                        row.children[1].textContent = k.boundSession || 'Unbound';
                        row.children[2].textContent = k.expiresAt ? new Date(k.expiresAt).toLocaleDateString() : 'N/A';

                        const statusSpan = document.createElement('span');
                        statusSpan.style.color = statusColor;
                        statusSpan.textContent = statusText;
                        row.children[3].appendChild(statusSpan);

                        row.children[4].querySelector('button').addEventListener('click', () => revokeKey(k._id));
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No license keys found in database.</td></tr>`;
                }
            } catch (err) {
                console.error('Failed to load keys', err);
            }
        }

        async function generateKey() {
            const daysInput = document.getElementById('key-duration-days');
            const durationDays = Math.max(1, Math.min(3650, parseInt(daysInput.value, 10) || 30));

            try {
                const res = await fetch('/api/admin/generate', {
                    method: 'POST',
                    headers: getAdminHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ durationDays })
                });
                const data = await res.json();

                if (res.status === 401) {
                    logoutAdmin();
                    alert('Unauthorized. Please log in again.');
                    return;
                }

                if (res.ok && data.success) {
                    fetchKeys();
                } else {
                    alert(data.error || 'Error generating key');
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        async function revokeKey(id) {
            if (!confirm('Are you sure you want to revoke this license key?')) return;
            try {
                const res = await fetch(`/api/admin/revoke/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: getAdminHeaders()
                });
                const data = await res.json();

                if (res.status === 401) {
                    logoutAdmin();
                    alert('Unauthorized. Please log in again.');
                    return;
                }

                if (res.ok && data.success) {
                    fetchKeys();
                } else {
                    alert(data.error || 'Failed to revoke key');
                }
            } catch (err) {
                alert('Failed to revoke key');
            }
        }

        if (getAdminSecret()) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('dashboard-box').style.display = 'block';
            fetchKeys();
        }
    </script>
</body>

</html>
