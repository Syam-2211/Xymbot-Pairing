<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xymbot • SAP Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            --paper-bg: #f4f1ea;
            --paper-line: #d3c9b1;
            --paper-sheet: #fffdf9;
            --ink-blue: #1b3b6f;
            --ink-black: #1a1a1a;
            --accent-red: #c0392b;
            --pencil: #7f8c8d;
            --text-muted: #7f8c8d;
            --success: #317a4c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Special Elite', monospace;
            background-color: var(--paper-bg);
            background-image: linear-gradient(to right, var(--paper-line) 1px, transparent 1px), linear-gradient(to bottom, var(--paper-line) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 38px 36px 36px 64px;
            background: var(--paper-sheet);
            border: 2px dashed #b5a88c;
            box-shadow: 8px 12px 0 rgba(0, 0, 0, 0.12);
            position: relative;
            transform: rotate(-0.2deg);
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 44px;
            width: 2px;
            background: rgba(192, 57, 43, 0.3);
        }
        h1 {
            color: var(--ink-blue);
            font: 700 28px 'Kalam', cursive;
            margin-bottom: 6px;
        }
        .subtitle {
            color: var(--pencil);
            font: 600 19px 'Caveat', cursive;
            margin-bottom: 24px;
        }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label {
            display: block;
            color: var(--ink-blue);
            font: 700 15px 'Kalam', cursive;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 8px;
            background: transparent;
            border: 0;
            border-bottom: 2px solid var(--ink-black);
            color: var(--ink-blue);
            font: 16px 'Special Elite', monospace;
            outline: none;
        }
        input:focus { border-bottom-color: var(--ink-blue); }
        .btn-primary {
            padding: 12px 18px;
            background: var(--ink-blue);
            border: 2px solid var(--ink-black);
            color: #fff;
            font: 700 17px 'Kalam', cursive;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink-black);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink-black); }
        .sap-table-wrap { overflow-x: auto; margin-top: 16px; max-height: 60vh; border: 1px dashed #b5a88c; background: #fffefa; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #f0ece1; color: var(--ink-blue); padding: 12px; font: 700 15px 'Kalam', cursive; border-bottom: 2px solid var(--paper-line); }
        td { padding: 12px; color: var(--ink-black); border-bottom: 1px solid #e8e1d3; font: 13px 'Special Elite', monospace; }
        .action-btn { padding: 5px 9px; border: 1px solid var(--accent-red); background: #fff8f5; color: var(--accent-red); font: 700 13px 'Kalam', cursive; cursor: pointer; }
        @media (max-width: 640px) {
            body { align-items: flex-start; padding: 14px; }
            .container { padding: 30px 18px 24px 42px; }
            .container::before { left: 28px; }
            #dashboard-box > div:first-child { align-items: flex-start !important; flex-direction: column; }
            #dashboard-box > div:first-child .btn-primary { width: 100% !important; }
        }
    </style>
</head>
<body>
    <div class="container" id="admin-hub">
        <div id="login-box">
            <h1>🔒 Admin SAP Authentication</h1>
            <p class="subtitle">Enter your master admin password to access control panel.</p>
            <div class="input-group">
                <label>Admin Secret Key</label>
                <input type="password" id="admin-secret" placeholder="Enter master key...">
            </div>
            <button class="btn-primary" onclick="verifyAdmin()">Login to Dashboard</button>
        </div>

        <div id="dashboard-box" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div>
                    <h1>SAP Control Center</h1>
                    <p class="subtitle">Manage, view, and revoke active customer license keys.</p>
                </div>
                <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="generateKey()">+ Generate Key</button>
            </div>
            <div class="sap-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>License Key</th>
                            <th>Bound Session</th>
                            <th>Expires At</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="keys-table-body">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        anime({ targets: '#admin-hub', opacity: [0, 1], translateY: [20, 0], duration: 800, easing: 'easeOutExpo' });

        async function verifyAdmin() {
            const secret = document.getElementById('admin-secret').value.trim();
            if (secret === 'binisha') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard-box').style.display = 'block';
                fetchKeys();
            } else {
                alert('Access Denied: Incorrect Admin Key!');
            }
        }

        async function fetchKeys() {
            try {
                const res = await fetch('/api/admin/keys');
                const data = await res.json();
                const tbody = document.getElementById('keys-table-body');
                tbody.innerHTML = '';
                
                if (data.keys && data.keys.length > 0) {
                    data.keys.forEach(k => {
                        const statusColor = k.isActivated ? 'var(--success)' : 'var(--text-muted)';
                        const statusText = k.isActivated ? 'Active' : 'Unused';
                        tbody.innerHTML += `
                            <tr>
                                <td>${k.key}</td>
                                <td>${k.boundSession || 'Unbound'}</td>
                                <td>${k.expiresAt ? new Date(k.expiresAt).toLocaleDateString() : 'N/A'}</td>
                                <td><span style="color:${statusColor}">${statusText}</span></td>
                                <td><button class="action-btn btn-delete" onclick="revokeKey('${k._id}')">Revoke</button></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No license keys found in database.</td></tr>`;
                }
            } catch (err) {
                console.error('Failed to load keys', err);
            }
        }

        async function generateKey() {
            try {
                const res = await fetch('/api/admin/generate', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    fetchKeys();
                } else {
                    alert('Error generating key');
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        async function revokeKey(id) {
            if (!confirm('Are you sure you want to revoke this license key?')) return;
            try {
                const res = await fetch(`/api/admin/revoke/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    fetchKeys();
                }
            } catch (err) {
                alert('Failed to revoke key');
            }
        }
    </script>
</body>
</html>
