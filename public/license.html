<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xymbot • License & Key Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            --paper-bg: #f4f1ea;
            --paper-line: #d3c9b1;
            --ink-blue: #1b3b6f;
            --ink-black: #1a1a1a;
            --accent-red: #c0392b;
            --pencil: #7f8c8d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(to right, var(--paper-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--paper-line) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            font-family: 'Special Elite', monospace;
        }

        #crumple-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #d8d3c5;
            background-image: radial-gradient(#b8b1a2 20%, transparent 21%), radial-gradient(#b8b1a2 20%, transparent 21%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: 999;
            display: none;
            opacity: 0;
            pointer-events: none;
            filter: contrast(150%) brightness(90%);
        }

        .notebook-card {
            width: 100%;
            max-width: 520px;
            background: #fffdf9;
            border: 2px dashed #b5a88c;
            padding: 40px;
            box-shadow: 8px 12px 0px rgba(0, 0, 0, 0.12);
            position: relative;
            transform: rotate(0.5deg);
            transition: transform 0.3s ease;
        }

        .notebook-card::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 45px;
            width: 2px;
            background: rgba(192, 57, 43, 0.3);
        }

        .header h1 {
            font-family: 'Kalam', cursive;
            font-size: 32px;
            color: var(--ink-blue);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-family: 'Caveat', cursive;
            font-size: 20px;
            color: var(--pencil);
            margin-bottom: 28px;
        }

        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 14px;
            font-family: 'Kalam', cursive;
            color: var(--ink-blue);
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--ink-black);
            font-size: 22px;
            outline: none;
            font-family: 'Caveat', cursive;
            letter-spacing: 1px;
        }

        input.blue-ink { color: var(--ink-blue); }
        input.black-ink { color: var(--ink-black); }

        input::placeholder {
            color: #b5a88c;
            font-family: 'Special Elite', monospace;
            font-size: 13px;
        }

        .stamp-btn {
            width: 100%;
            padding: 14px;
            background: var(--ink-blue);
            color: #fff;
            border: 2px solid var(--ink-black);
            font-family: 'Kalam', cursive;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--ink-black);
            transition: all 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .stamp-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--ink-black);
        }

        .btn-secondary { background: #7f8c8d; margin-top: 12px; }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            background: #fcf8ec;
            border: 2px dashed var(--ink-blue);
            text-align: center;
            display: none;
        }

        .code-display {
            font-family: 'Special Elite', monospace;
            font-size: 22px;
            color: var(--accent-red);
            letter-spacing: 2px;
            background: #fff;
            padding: 10px;
            border: 1px solid var(--paper-line);
            display: inline-block;
            word-break: break-all;
        }

        #custom-alert {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; display: none; opacity: 0;
        }

        .alert-card {
            background: #fffdf9;
            border: 2px solid var(--ink-blue);
            padding: 30px; max-width: 380px; width: 90%;
            text-align: center; box-shadow: 6px 6px 0px var(--ink-black);
            transform: scale(0.9);
        }

        .alert-card h3 { font-family: 'Kalam', cursive; font-size: 24px; color: var(--accent-red); margin-bottom: 10px; }
        .alert-card p { font-family: 'Caveat', cursive; font-size: 20px; color: var(--ink-black); margin-bottom: 20px; }
        .alert-btn { background: var(--ink-blue); color: #fff; border: 1px solid var(--ink-black); padding: 8px 24px; font-family: 'Kalam', cursive; font-size: 18px; cursor: pointer; }

        .footer-scribbles {
            margin-top: 30px; display: flex; justify-content: space-between;
            font-family: 'Caveat', cursive; font-size: 18px;
        }
        .footer-scribbles a { color: var(--ink-blue); text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div id="crumple-overlay"></div>

    <div id="custom-alert">
        <div class="alert-card" id="alert-card-inner">
            <h3 id="alert-title">Notice Note</h3>
            <p id="alert-message">Something went wrong!</p>
            <button class="alert-btn" onclick="closeAlert()">Okay, Got it</button>
        </div>
    </div>

    <div class="notebook-card" id="main-card">
        <div class="header">
            <h1>License Key Journal</h1>
            <p>// verify access or request an XYM-key stamp</p>
        </div>

        <form id="license-form">
            <div class="input-group">
                <label>Enter Your License Key:</label>
                <input type="text" id="license-key-input" class="pen-input" placeholder="XYM-XXXX-XXXX-XXXX" required>
            </div>
            <button type="submit" class="stamp-btn" id="verify-btn">Verify License Key</button>
        </form>

        <button type="button" class="stamp-btn btn-secondary" id="gen-key-btn" onclick="generateClientKey()">Generate New License Key</button>

        <div id="license-result" class="result-box">
            <h3 id="result-title" style="font-family:'Kalam'; color:var(--ink-blue)">License Status</h3>
            <p id="result-desc" style="font-family:'Caveat'; font-size:18px; color:var(--pencil)">Details regarding your access key:</p>
            <code class="code-display" id="result-code">---</code>
        </div>

        <div class="footer-scribbles">
            <a onclick="crumpleTransition('/')">➔ Back to Pairing Portal</a>
            <span>[Journal v2.6]</span>
        </div>
    </div>

    <script>
        document.querySelectorAll('.pen-input').forEach(input => {
            input.classList.add(Math.random() > 0.5 ? 'blue-ink' : 'black-ink');
        });

        function showAlert(title, message) {
            const alertBox = document.getElementById('custom-alert');
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            alertBox.style.display = 'flex';
            anime({ targets: alertBox, opacity: [0, 1], duration: 200, easing: 'easeOutQuad' });
            anime({ targets: '#alert-card-inner', scale: [0.8, 1], duration: 300, easing: 'spring(1, 80, 10, 0)' });
        }

        function closeAlert() {
            const alertBox = document.getElementById('custom-alert');
            anime({ targets: alertBox, opacity: [1, 0], duration: 200, easing: 'easeInQuad', complete: () => alertBox.style.display = 'none' });
        }

        function crumpleTransition(targetUrl) {
            const overlay = document.getElementById('crumple-overlay');
            overlay.style.display = 'block';

            anime.timeline()
                .add({ targets: overlay, opacity: [0, 0.95], scale: [1.3, 1], duration: 250, easing: 'easeInOutExpo' })
                .add({
                    targets: '#main-card',
                    scale: [1, 0.6],
                    rotate: [0.5, -15],
                    translateX: [0, 20],
                    skewX: [0, -20],
                    opacity: [1, 0],
                    duration: 350,
                    easing: 'easeInOutBack',
                    complete: () => { window.location.href = targetUrl; }
                }, 0);
        }

        document.getElementById('license-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('license-key-input').value.trim();
            const resultBox = document.getElementById('license-result');
            const verifyBtn = document.getElementById('verify-btn');
            verifyBtn.innerText = "Checking Journal...";
            verifyBtn.disabled = true;

            try {
                const res = await fetch(`/api/verify-license?key=${encodeURIComponent(key)}`);
                const data = await res.json();
                resultBox.style.display = 'block';
                if (data.valid) {
                    document.getElementById('result-title').innerText = "Status: Verified Active ✓";
                    document.getElementById('result-desc').innerText = "This license key is valid and authorized.";
                    document.getElementById('result-code').innerText = key;
                } else {
                    document.getElementById('result-title').innerText = "Status: Invalid Key ✕";
                    document.getElementById('result-desc').innerText = data.message || "Key not found or expired.";
                    document.getElementById('result-code').innerText = "ACCESS DENIED";
                }
                anime({ targets: resultBox, scale: [0.9, 1], opacity: [0, 1], duration: 400 });
            } catch (err) {
                showAlert("Connection Error", "Could not reach the server verification endpoint.");
            } finally {
                verifyBtn.innerText = "Verify License Key";
                verifyBtn.disabled = false;
            }
        });

        async function generateClientKey() {
            const genBtn = document.getElementById('gen-key-btn');
            const resultBox = document.getElementById('license-result');
            genBtn.innerText = "Stamping New Key...";
            genBtn.disabled = true;

            try {
                const res = await fetch('/api/client-generate-key', { method: 'POST' });
                const data = await res.json();
                if (data.key) {
                    resultBox.style.display = 'block';
                    document.getElementById('result-title').innerText = "New Key Generated! 🎉";
                    document.getElementById('result-desc').innerText = "Save this stamped key securely for your bot:";
                    document.getElementById('result-code').innerText = data.key;
                    document.getElementById('license-key-input').value = data.key;
                    anime({ targets: resultBox, scale: [0.9, 1], opacity: [0, 1], duration: 400 });
                    showAlert("Key Created", "Your new license key has been successfully stamped.");
                } else {
                    showAlert("Error", data.error || "Could not generate key.");
                }
            } catch (err) {
                showAlert("Connection Error", "Failed to communicate with key generator.");
            } finally {
                genBtn.innerText = "Generate New License Key";
                genBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
